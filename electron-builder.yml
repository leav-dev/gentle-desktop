appId: dev.gentledesktop.app
productName: Gentle Desktop
directories:
  output: release
  buildResources: build

# The engine is spawned as a script by Electron's own Node, so the two runtime packages
# must live outside the asar archive to be readable by a child process.
asarUnpack:
  - node_modules/@earendil-works/**
  - node_modules/gentle-pi/**

win:
  target:
    - nsis
  artifactName: ${name}-${version}-${arch}.${ext}
  # Editing the executable's resources pulls in electron-builder's signing toolkit, whose
  # archive holds macOS symlinks. Extracting those needs a privilege a normal Windows account
  # does not have, so the build died there before reaching NSIS. Skipping the edit costs the
  # custom icon and version metadata in the .exe; it buys a build anyone can reproduce.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development
