appId: dev.gentledesktop.app
productName: Gentle Desktop
directories:
  output: release
  buildResources: build

# The engine is spawned as a script by Electron's own Node, so the two runtime packages
# must live outside the asar archive to be readable by a child process.
asarUnpack:
  - node_modules/@earendil-works/**
  - node_modules/gentle-pi/**

win:
  target:
    - nsis
  artifactName: ${name}-${version}-${arch}.${ext}
  # The app's own icon (petal mark, generated by scripts/make-icon.mjs).
  # EXPERIMENT RESULT: with signAndEditExecutable: false electron-builder never
  # touches the .exe's resources, so this file is NOT embedded in the app
  # executable — it only feeds the NSIS installer (its .exe and shortcuts).
  # See the note on signAndEditExecutable below for why.
  icon: build/icon.ico
  # Editing the executable's resources pulls in electron-builder's signing toolkit, whose
  # archive holds macOS symlinks. Extracting those needs a privilege a normal Windows account
  # does not have, so the build died there before reaching NSIS. Skipping the edit costs the
  # custom icon and version metadata in the .exe; it buys a build anyone can reproduce.
  signAndEditExecutable: false

nsis:
  # Per-user install: no administrator prompt, no UAC, nothing to escalate. Someone who has
  # never installed a developer tool should be able to double-click and be done.
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  # Registered where a Windows user actually looks: a named entry at the top level of the
  # Start menu, a desktop shortcut, and one row in Apps & features under this name.
  createStartMenuShortcut: true
  createDesktopShortcut: true
  shortcutName: Gentle Desktop
  menuCategory: false
  uninstallDisplayName: Gentle Desktop
  runAfterFinish: true
  # Sessions, settings and credentials live in the agent directory, not here; uninstalling
  # must not decide for the user that their history is disposable.
  deleteAppDataOnUninstall: false

mac:
  target:
    - dmg
  category: public.app-category.developer-tools

linux:
  target:
    - AppImage
  category: Development
