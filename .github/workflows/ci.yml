name: CI

# Three questions, in order: is the tree sound (every push and PR), does it package on each
# platform (tags only), and does the release carry those packages (tags only).
#
# Packaging is deliberate: three platforms take runner minutes that teach nothing on a commit
# nobody is shipping. The cost of that choice is that a broken packaging config is found at
# release time, so the manual trigger below exists to try it without tagging.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package:
        description: Build the packages without publishing them
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, tests, build
    # Windows on purpose: it is the platform this fork ships to, and the defects that have
    # actually reached the user — a corrupt asar, CRLF files, a privilege-gated build — were
    # platform defects. A green Linux run would have said less.
    runs-on: windows-latest
    env:
      # This job never launches Electron. Skipping the binary keeps the install short.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # A transitive dependency (gentle-pi) compiles its own helper binary during install
      # and refuses a Go older than 1.25.10. The runner's preinstalled Go is older, so
      # without this step the install fails before a single test is attempted.
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          # There is no go.sum in this repository to key a module cache on.
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Quoted on purpose: PowerShell does not expand the glob, and Node does.
      - name: Tests
        run: node --test "tests/*.test.mts"

      - name: Build
        run: pnpm build

  package:
    name: package (${{ matrix.platform }})
    needs: verify
    # Tags only. A push to main proves the tree; it does not deserve three packaged builds
    # nobody will download. The manual trigger is the escape hatch for testing packaging
    # without minting a version.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.package)
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-latest
            args: --linux AppImage
          - platform: macos
            os: macos-latest
            args: --mac dmg
          - platform: windows
            os: windows-latest
            args: --win nsis
    runs-on: ${{ matrix.os }}
    env:
      # No certificate anywhere: the builds are unsigned on purpose and saying so is better
      # than a signing step that fails on a machine that has no identity to sign with.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: false

      - name: Install
        run: pnpm install --frozen-lockfile

      # The version in package.json is what ends up in the file names, and the tag is what the
      # release is about. A v0.1.1 release carrying 0.1.0 binaries is a download that lies
      # about itself, so the tag wins here — the repository keeps its own version for main.
      - name: Align the version with the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: pnpm version "${GITHUB_REF_NAME#v}" --no-git-tag-version

      - name: Build
        run: pnpm build

      - name: Package
        run: npx electron-builder ${{ matrix.args }} --publish never

      # The packaging step is where the platform's own binary leaves the pipeline; keeping it
      # as an artifact is what lets a run be inspected after the fact.
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ github.sha }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
          if-no-files-found: error
          retention-days: 14

  release:
    name: attach packages to the release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # The only job allowed to write: it publishes the binaries the tag names.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          # A tag with no release yet is normal — the release is created here, with the
          # notes from the repository's default branch, then the binaries are attached.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes
          find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' \) -print0 |
            xargs -0 -r gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" --clobber
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets \
            -q '.assets[] | "\(.name) — \(.size / 1048576 | floor) MB"'
